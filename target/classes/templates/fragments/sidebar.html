<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<body>

<aside th:fragment="sidebar(active)"
       class="sidebar">

    <div class="sidebar-brand">

        <div class="brand-logo">
            <span>♧</span>
        </div>

        <div>
            <strong>Vichayal</strong>
            <small>Riego Web</small>
        </div>

    </div>

    <div class="sidebar-organization">
        <small>COMISIÓN DE REGANTES</small>
        <span>Vichayal · Piura</span>
    </div>

    <p class="sidebar-title">
        GESTIÓN DE RIEGO
    </p>

    <nav class="sidebar-nav">

        <!-- Todos los usuarios -->
        <a th:href="@{/dashboard}"
           th:classappend="${active == 'dashboard'} ? ' active' : ''">

            <span class="nav-icon">▦</span>
            <span>Dashboard</span>

        </a>

        <!-- Administrador y operador -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','OPERADOR')"
           th:href="@{/turnos}"
           th:classappend="${active == 'turnos'} ? ' active' : ''">

            <span class="nav-icon">▣</span>
            <span>Turnos de riego</span>

        </a>

        <!-- Administrador y operador -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','OPERADOR')"
           th:href="@{/agricultores}"
           th:classappend="${active == 'agricultores'} ? ' active' : ''">

            <span class="nav-icon">♙</span>
            <span>Agricultores</span>

        </a>

        <!-- Administrador y operador -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','OPERADOR')"
           th:href="@{/parcelas}"
           th:classappend="${active == 'parcelas'} ? ' active' : ''">

            <span class="nav-icon">◇</span>
            <span>Parcelas</span>

        </a>

        <!-- Administrador y tesorería -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','TESORERIA')"
           th:href="@{/tesoreria}"
           th:classappend="${active == 'tesoreria'} ? ' active' : ''">

            <span class="nav-icon">▤</span>
            <span>Tesorería</span>

        </a>

        <!-- Administrador, operador y tesorería -->
        <a sec:authorize="
            hasAnyRole('ADMINISTRADOR','OPERADOR','TESORERIA')"
           th:href="@{/reportes}"
           th:classappend="${active == 'reportes'} ? ' active' : ''">

            <span class="nav-icon">▥</span>
            <span>Reportes</span>

        </a>

        <!-- Administrador y operador -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','OPERADOR')"
           th:href="@{/inteligencia}"
           th:classappend="${active == 'inteligencia'} ? ' active' : ''">

            <span class="nav-icon">✦</span>
            <span>Inteligencia Artificial</span>

        </a>

        <!-- Solo administrador -->
        <a sec:authorize="hasRole('ADMINISTRADOR')"
           th:href="@{/usuarios}"
           th:classappend="${active == 'usuarios'} ? ' active' : ''">

            <span class="nav-icon">⚙</span>
            <span>Usuarios y roles</span>

        </a>

    </nav>

    <div class="sidebar-footer">

        <div class="sidebar-user">

            <div class="sidebar-avatar"
                 sec:authentication="principal.iniciales">
                AD
            </div>

            <div>
                <strong sec:authentication=
                                "principal.nombreCompleto">
                    Usuario
                </strong>

                <small sec:authentication=
                               "principal.rolLegible">
                    Rol
                </small>
            </div>

        </div>

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="logout-button">

                <span>↪</span>
                <span>Cerrar sesión</span>

            </button>

        </form>

        <small class="version">
            Vichayal Riego Web · v1.0
        </small>

    </div>

</aside>

</body>
</html>
