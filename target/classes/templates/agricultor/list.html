<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v4.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('agricultores')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Agricultores')}"></div><main><h1>Agricultores</h1><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div><a class="btn" th:href="@{/agricultores/nuevo}">Nuevo agricultor</a><form class="search"><input name="q" th:value="${q}" placeholder="Nombre o DNI"><button>Buscar</button></form><table><tr><th>Nombre</th><th>DNI</th><th>Sector</th><th>Estado</th><th>Acciones</th></tr><tr th:each="a:${pagina.content}"><td th:text="|${a.nombres} ${a.apellidos}|"></td><td th:text="${a.dni}"></td><td th:text="${a.sector}"></td><td><span class="pill" th:text="${a.estado}"></span></td><td class="actions"><a th:href="@{/agricultores/{id}/editar(id=${a.id})}">Editar</a><form th:action="@{/agricultores/{id}/estado(id=${a.id})}" method="post"><button class="link" th:text="${a.estado=='ACTIVO'?'Desactivar':'Reactivar'}"></button></form><form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/agricultores/{id}/eliminar(id=${a.id})}" method="post" onsubmit="return confirm('¿Eliminar agricultor?');"><button class="link danger">Eliminar</button></form></td></tr></table></main></section></body></html>
