<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('agricultores')}">
</div>
<section class="workspace">

    <div th:replace=
                 "~{fragments/header :: header('Agricultores')}">
    </div>
<main><h1>Agricultores</h1><a class="btn" th:href="@{/agricultores/nuevo}">Nuevo agricultor</a>
    <form><input name="q" th:value="${q}" placeholder="Nombre o DNI">
        <button>Buscar</button>
    </form>
    <table>
        <tr>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Sector</th>
            <th>Estado</th>
            <th></th>
        </tr>
        <tr th:each="a:${pagina.content}">
            <td th:text="${a.nombres+' '+a.apellidos}"></td>
            <td th:text="${a.dni}"></td>
            <td th:text="${a.sector}"></td>
            <td th:text="${a.estado}"></td>
            <td><a th:href="@{/agricultores/{id}/editar(id=${a.id})}">Editar</a></td>
        </tr>
    </table>
</main>
</section>
</body>
</html>
