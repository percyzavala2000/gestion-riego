<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Nueva cuenta</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v6.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('tesoreria')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Nueva cuenta por cobrar')}"></div><main class="content"><section class="finance-card"><form class="form" th:object="${form}" th:action="@{/tesoreria/cuentas/guardar}" method="post"><div class="notice bad" th:if="${#fields.hasGlobalErrors()}"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Agricultor</label><select th:field="*{agricultorId}"><option value="">Selecciona</option><option th:each="a:${agricultores}" th:value="${a.id}" th:text="|${a.nombres} ${a.apellidos}|"></option></select><label>Concepto</label><select th:field="*{conceptoId}"><option value="">Selecciona</option><option th:each="c:${conceptos}" th:value="${c.id}" th:text="${c.nombre}"></option></select><label>Monto total</label><input type="number" step=".01" th:field="*{montoTotal}"><label>Fecha de emisión</label><input type="date" th:field="*{fechaEmision}"><label>Fecha de vencimiento</label><input type="date" th:field="*{fechaVencimiento}"><label>Observaciones</label><textarea th:field="*{observaciones}"></textarea><div class="form-actions"><a class="btn secondary" th:href="@{/tesoreria/cuentas}">Cancelar</a><button class="btn primary">Emitir cuenta</button></div></form></section></main></section></body></html>
