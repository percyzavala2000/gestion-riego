<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Cuentas por cobrar</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v6.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('tesoreria')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Cuentas por cobrar')}"></div><main class="content"><header class="page-title"><div><h1>Cuentas por cobrar</h1><p>Controla obligaciones, pagos parciales y saldos pendientes.</p></div><div class="actions"><a class="btn secondary" th:href="@{/tesoreria/conceptos}">Conceptos</a><a class="btn primary" th:href="@{/tesoreria/cuentas/nueva}">Nueva cuenta</a></div></header><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div><div class="table-responsive"><table><thead><tr><th>Código</th><th>Agricultor</th><th>Concepto</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${cuentas}"><td th:text="${c.codigo}"></td><td th:text="|${c.agricultor.nombres} ${c.agricultor.apellidos}|"></td><td th:text="${c.concepto.nombre}"></td><td th:text="|S/ ${c.montoTotal}|"></td><td th:text="|S/ ${c.montoPagado}|"></td><td th:text="|S/ ${c.saldoPendiente}|"></td><td th:text="${c.fechaVencimiento}"></td><td><span class="pill" th:text="${c.estado}"></span></td><td class="actions"><a th:href="@{/tesoreria/cuentas/{id}(id=${c.id})}">Ver y pagar</a><form th:if="${c.estado!='PAGADA' and c.estado!='ANULADA'}" th:action="@{/tesoreria/cuentas/{id}/anular(id=${c.id})}" method="post"><input name="motivo" placeholder="Motivo" required><button class="link danger">Anular</button></form></td></tr></tbody></table></div></main></section></body></html>
