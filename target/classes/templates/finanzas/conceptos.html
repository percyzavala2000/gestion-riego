<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Conceptos de cobro</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v6.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('tesoreria')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Conceptos de cobro')}"></div><main class="content"><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><section class="finance-card"><form class="form" th:object="${form}" method="post"><div class="notice bad" th:if="${#fields.hasGlobalErrors()}"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Código</label><input th:field="*{codigo}"><label>Nombre</label><input th:field="*{nombre}"><label>Descripción</label><textarea th:field="*{descripcion}"></textarea><label><input type="checkbox" th:field="*{activo}"> Activo</label><button class="btn primary">Crear concepto</button></form></section><table><tr><th>Código</th><th>Nombre</th><th>Estado</th></tr><tr th:each="c:${conceptos}"><td th:text="${c.codigo}"></td><td th:text="${c.nombre}"></td><td th:text="${c.activo?'ACTIVO':'INACTIVO'}"></td></tr></table><a class="btn secondary" th:href="@{/tesoreria/cuentas}">Volver</a></main></section></body></html>
