<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('parcelas')}">
</div>
<main><h1>Crear turno</h1>
    <form class="form" th:object="${form}" th:action="@{/turnos}" method="post">
        <div th:each="e:${#fields.globalErrors()}" th:text="${e}"></div>
        <select th:field="*{parcelaId}">
            <option value="">Parcela</option>
            <option th:each="p:${parcelas}" th:value="${p.id}" th:text="${p.codigo+' · '+p.nombre}"></option>
        </select><input type="date" th:field="*{fecha}"><input type="time" th:field="*{horaInicio}"><input type="number"
                                                                                                           th:field="*{duracionMinutos}"
                                                                                                           placeholder="Duración minutos"><textarea
            th:field="*{observaciones}"></textarea>
        <button>Guardar turno</button>
    </form>
</main>
</body>
</html>
