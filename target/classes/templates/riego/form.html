<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('turnos')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Turnos de riego')}"></div><main><h1 th:text="${id==null?'Crear turno':'Editar turno'}"></h1><form class="form" th:object="${form}" th:action="@{/turnos/guardar}" method="post"><input type="hidden" name="id" th:value="${id}"><div th:each="e:${#fields.globalErrors()}" th:text="${e.defaultMessage}"></div><label>Parcela activa</label><select th:field="*{parcelaId}"><option value="">Selecciona</option><option th:each="p:${parcelas}" th:value="${p.id}" th:text="|${p.codigo} · ${p.nombre}|"></option></select><label>Fecha</label><input type="date" th:field="*{fecha}"><label>Hora</label><input type="time" th:field="*{horaInicio}"><label>Duración</label><input type="number" min="30" th:field="*{duracionMinutos}"><label>Observaciones</label><textarea th:field="*{observaciones}"></textarea><button>Guardar turno</button></form></main></section></body></html>
