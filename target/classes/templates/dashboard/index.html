<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>Dashboard</title></head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('dashboard')}">
</div>
<section class="workspace">
    <div th:replace=
                 "~{fragments/header :: header('Dashboard')}">
    </div>
<main><h1>Dashboard</h1>
    <div class="cards">
        <article>Turnos hoy<strong th:text="${turnos}">0</strong></article>
        <article>Agricultores<strong th:text="${agricultores}">0</strong></article>
        <article>Parcelas<strong th:text="${parcelas}">0</strong></article>
        <article>Ingresos<strong>S/ <span th:text="${ingresos}">0</span></strong></article>
    </div>
</main>
</section>
</body>
</html>
