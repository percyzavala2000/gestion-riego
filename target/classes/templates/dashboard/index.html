<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>Dashboard</title></head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('dashboard')}">
</div>
<section class="workspace">
    <div th:replace=
                 "~{fragments/header :: header('Dashboard')}">
    </div>
<main><h1>Dashboard</h1>
    <section sec:authorize="hasRole('ADMINISTRADOR')">

        <div class="cards">

            <article class="dashboard-card">
                <span>Turnos de hoy</span>

                <strong th:text="${resumen.turnosHoy}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Agricultores activos</span>

                <strong th:text="${resumen.agricultoresActivos}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Parcelas registradas</span>

                <strong th:text="${resumen.parcelasRegistradas}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Ingresos</span>

                <strong>
                    S/
                    <span th:text="${resumen.totalIngresos}">
                    0.00
                </span>
                </strong>
            </article>

        </div>

    </section>
    <section sec:authorize="hasRole('OPERADOR')">

        <div class="cards">

            <article class="dashboard-card">
                <span>Turnos de hoy</span>

                <strong th:text="${resumen.turnosHoy}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Turnos programados</span>

                <strong th:text="${resumen.turnosProgramados}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Agricultores activos</span>

                <strong th:text="${resumen.agricultoresActivos}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Parcelas registradas</span>

                <strong th:text="${resumen.parcelasRegistradas}">
                    0
                </strong>
            </article>

        </div>

    </section>
    <section sec:authorize="hasRole('TESORERIA')">

        <div class="cards">

            <article class="dashboard-card">
                <span>Ingresos registrados</span>

                <strong>
                    S/
                    <span th:text="${resumen.totalIngresos}">
                    0.00
                </span>
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Pagos registrados</span>

                <strong th:text="${resumen.cantidadPagos}">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Deuda pendiente</span>

                <strong>
                    S/
                    <span th:text="${resumen.totalDeuda}">
                    0.00
                </span>
                </strong>
            </article>

            <article class="dashboard-card">
                <span>Agricultores con deuda</span>

                <strong th:text="${resumen.agricultoresConDeuda}">
                    0
                </strong>
            </article>

        </div>

    </section>
</main>
</section>
</body>
</html>
