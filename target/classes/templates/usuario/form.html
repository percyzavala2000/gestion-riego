<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuario</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v5.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Usuarios y roles')}"></div><main class="content"><header class="page-title"><div><h1 th:text="${id == null} ? 'Nuevo usuario' : 'Editar usuario'"></h1><p>Define la identidad, el rol y el estado de acceso.</p></div><a class="btn secondary" th:href="@{/usuarios}">Volver</a></header><section class="user-form-card"><form class="form" th:object="${form}" th:action="@{/usuarios/guardar}" method="post"><input type="hidden" name="id" th:value="${id}"><div class="notice bad" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><div class="form-group"><label>Nombre de usuario</label><input th:field="*{username}" maxlength="50"><small class="field-error" th:errors="*{username}"></small></div><div class="form-grid"><div class="form-group"><label>Nombres</label><input th:field="*{nombres}" maxlength="100"><small class="field-error" th:errors="*{nombres}"></small></div><div class="form-group"><label>Apellidos</label><input th:field="*{apellidos}" maxlength="120"><small class="field-error" th:errors="*{apellidos}"></small></div></div><div class="form-group"><label>Rol</label><select th:field="*{rol}"><option value="">Selecciona un rol</option><option th:each="r : ${roles}" th:value="${r.codigo}" th:text="${r.nombre}"></option></select><small class="field-error" th:errors="*{rol}"></small></div><div th:if="${id == null}" class="form-grid"><div class="form-group"><label>Contraseña inicial</label><input type="password" th:field="*{password}" autocomplete="new-password"></div><div class="form-group"><label>Confirmar contraseña</label><input type="password" th:field="*{confirmarPassword}" autocomplete="new-password"></div></div><label class="checkbox-row"><input type="checkbox" th:field="*{activo}"><span>Cuenta activa</span></label><div class="form-actions"><a class="btn secondary" th:href="@{/usuarios}">Cancelar</a><button class="btn primary">Guardar usuario</button></div></form></section></main></section></body></html>
