<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios y roles</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v5.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Usuarios y roles')}"></div><main class="content"><header class="page-title"><div><h1>Usuarios y roles</h1><p>Administra cuentas, permisos y estados de acceso.</p></div><a class="btn primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a></header><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div><div class="table-responsive"><table><thead><tr><th>Usuario</th><th>Nombre completo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="empty-state">No existen usuarios.</td></tr><tr th:each="u : ${usuarios}"><td th:text="${u.username}"></td><td th:text="|${u.nombres} ${u.apellidos}|"></td><td th:text="${u.rol.nombre}"></td><td><span class="pill" th:classappend="${u.activo} ? ' active-pill' : ' inactive-pill'" th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'"></span></td><td class="actions"><a th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a><a th:href="@{/usuarios/{id}/password(id=${u.id})}">Contraseña</a><form th:if="${u.id != usuarioActualId}" th:action="@{/usuarios/{id}/estado(id=${u.id})}" method="post"><button class="link" th:classappend="${u.activo} ? ' danger' : ' positive'" th:text="${u.activo} ? 'Desactivar' : 'Activar'"></button></form><span th:if="${u.id == usuarioActualId}" class="current-account">Cuenta actual</span></td></tr></tbody></table></div></main></section></body></html>
