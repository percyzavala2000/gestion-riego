<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/v7.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('reportes')}"></div>
<section class="workspace">
    <div th:replace="~{fragments/header :: header('Reportes')}"></div>
    <main class="content">
        <header class="page-title">
            <div><h1>Centro de reportes</h1>
                <p>Consulta información operativa y financiera del sistema.</p></div>
        </header>
        <section class="report-grid">
            <article sec:authorize="hasAnyRole('ADMINISTRADOR','OPERADOR')"><h2>Reportes operativos</h2>
                <p>Agricultores, parcelas y turnos.</p><a class="btn primary"
                                                          th:href="@{/reportes/operativos}">Abrir</a></article>
            <article sec:authorize="hasAnyRole('ADMINISTRADOR','TESORERIA')"><h2>Reportes financieros</h2>
                <p>Pagos, deuda y cuentas por cobrar.</p><a class="btn primary"
                                                            th:href="@{/reportes/financieros}">Abrir</a></article>
        </section>
        <section class="summary-grid">
            <article><span>Agricultores</span><strong th:text="${resumen.agricultores}"></strong></article>
            <article><span>Parcelas</span><strong th:text="${resumen.parcelas}"></strong></article>
            <article><span>Turnos</span><strong th:text="${resumen.turnos}"></strong></article>
            <article><span>Pagos</span><strong th:text="${resumen.pagos}"></strong></article>
            <article sec:authorize="hasAnyRole('ADMINISTRADOR','TESORERIA')"><span>Ingresos confirmados</span><strong
                    th:text="|S/ ${resumen.ingresos}|"></strong></article>
            <article sec:authorize="hasAnyRole('ADMINISTRADOR','TESORERIA')"><span>Deuda pendiente</span><strong
                    th:text="|S/ ${resumen.deudaPendiente}|"></strong></article>
        </section>
    </main>
</section>
</body>
</html>
