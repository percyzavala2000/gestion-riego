spring.datasource.url=${DEMO_DB_URL:jdbc:postgresql://localhost:5433/gestion_riego_demo}
spring.datasource.username=${DEMO_DB_USERNAME:gestion_demo}
spring.datasource.password=${DEMO_DB_PASSWORD:demo_password_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
vichayal.demo.enabled=true
logging.level.pe.vichaval.gestionriego.config.seed=INFO

spring.docker.compose.enabled=false
