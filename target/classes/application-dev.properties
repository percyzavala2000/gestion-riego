spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_riego}
spring.datasource.username=${DB_USERNAME:gestion_user}
spring.datasource.password=${DB_PASSWORD:gestion_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
logging.level.pe.vichaval.gestionriego=DEBUG
