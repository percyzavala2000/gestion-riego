<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('turnos')}">
</div>
<main><h1>Turnos de riego</h1><a class="btn" th:href="@{/turnos/nuevo}">Crear turno</a>
    <table>
        <tr>
            <th>Código</th>
            <th>Parcela</th>
            <th>Fecha</th>
            <th>Horario</th>
            <th>Estado</th>
        </tr>
        <tr th:each="t:${turnos}">
            <td th:text="${t.codigo}"></td>
            <td th:text="${t.parcela.nombre}"></td>
            <td th:text="${t.fecha}"></td>
            <td th:text="|${t.horaInicio} - ${t.horaFin}|">
            </td>
            <td th:text="${t.estado}"></td>
        </tr>
    </table>
</main>
</body>
</html>
