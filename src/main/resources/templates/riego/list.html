<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turnos de riego</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=1072)}">
    <link rel="stylesheet" th:href="@{/css/v4.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('turnos')}"></div>
<section class="workspace">
    <div th:replace="~{fragments/header :: header('Turnos de riego')}"></div>

    <main class="content">
        <header class="page-title">
            <div>
                <h1>Turnos de riego</h1>
                <p>Busca por código, parcela o agricultor y filtra por estado.</p>
            </div>
            <a class="btn primary" th:href="@{/turnos/nuevo}">Crear turno</a>
        </header>

        <div class="notice ok" th:if="${exito}" th:text="${exito}"></div>
        <div class="notice bad" th:if="${error}" th:text="${error}"></div>

        <form class="list-filters" method="get" th:action="@{/turnos}">
            <input name="q"
                   th:value="${q}"
                   placeholder="Código, parcela o agricultor">

            <select name="estado">
                <option value="">Todos los estados</option>
                <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
                <option value="PROGRAMADO" th:selected="${estado == 'PROGRAMADO'}">Programado</option>
                <option value="EN_CURSO" th:selected="${estado == 'EN_CURSO'}">En curso</option>
                <option value="COMPLETADO" th:selected="${estado == 'COMPLETADO'}">Completado</option>
                <option value="CANCELADO" th:selected="${estado == 'CANCELADO'}">Cancelado</option>
                <option value="VENCIDO" th:selected="${estado == 'VENCIDO'}">Vencido</option>
            </select>

            <select name="size">
                <option value="10" th:selected="${size == 10}">10 por página</option>
                <option value="20" th:selected="${size == 20}">20 por página</option>
                <option value="50" th:selected="${size == 50}">50 por página</option>
            </select>

            <button class="btn primary" type="submit">Aplicar</button>
            <a class="btn secondary" th:href="@{/turnos}">Limpiar</a>
        </form>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Agricultor</th>
                    <th>Parcela</th>
                    <th>Fecha</th>
                    <th>Horario</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${pagina.empty}">
                    <td colspan="7" class="empty-state">
                        No existen turnos para los filtros aplicados.
                    </td>
                </tr>
                <tr th:each="turno : ${pagina.content}">
                    <td th:text="${turno.codigo}"></td>
                    <td th:text="|${turno.parcela.agricultor.nombres} ${turno.parcela.agricultor.apellidos}|"></td>
                    <td th:text="${turno.parcela.nombre}"></td>
                    <td th:text="${turno.fecha}"></td>
                    <td th:text="|${turno.horaInicio} - ${turno.horaFin}|"></td>
                    <td><span class="pill" th:text="${turno.estado}"></span></td>
                    <td class="actions">
                        <a th:if="${turno.estado == 'PENDIENTE' or turno.estado == 'PROGRAMADO'}"
                           th:href="@{/turnos/{id}/editar(id=${turno.id})}">Editar</a>

                        <form th:if="${turno.estado == 'PROGRAMADO'}"
                              th:action="@{/turnos/{id}/iniciar(id=${turno.id})}"
                              method="post">
                            <button class="link positive">Iniciar</button>
                        </form>

                        <form th:if="${turno.estado == 'EN_CURSO'}"
                              th:action="@{/turnos/{id}/completar(id=${turno.id})}"
                              method="post">
                            <button class="link positive">Completar</button>
                        </form>

                        <form th:if="${turno.estado == 'PENDIENTE' or turno.estado == 'PROGRAMADO' or turno.estado == 'EN_CURSO'}"
                              th:action="@{/turnos/{id}/cancelar(id=${turno.id})}"
                              method="post"
                              class="action-form">
                            <input name="motivo"
                                   maxlength="500"
                                   placeholder="Motivo"
                                   required>
                            <button class="link danger">Cancelar</button>
                        </form>

                        <a th:if="${turno.estado == 'CANCELADO' or turno.estado == 'VENCIDO'}"
                           th:href="@{/turnos/{id}/reprogramar(id=${turno.id})}">Reprogramar</a>

                        <span th:if="${turno.estado == 'COMPLETADO'}"
                              class="action-status">Turno finalizado</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginador(
                ${pagina},
                '/turnos',
                ${q},
                ${estado},
                ${size}
        )}"></div>
    </main>
</section>
</body>
</html>
