<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agricultores</title><link rel="stylesheet" th:href="@{/css/app.css(v=1071)}"><link rel="stylesheet" th:href="@{/css/v4.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('agricultores')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Agricultores')}"></div><main class="content"><header class="page-title"><div><h1>Agricultores</h1><p>Busca y filtra agricultores registrados.</p></div><a class="btn primary" th:href="@{/agricultores/nuevo}">Nuevo agricultor</a></header><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div><form class="list-filters" method="get" th:action="@{/agricultores}"><input name="q" th:value="${q}" placeholder="Nombre o DNI"><select name="estado"><option value="">Todos los estados</option><option value="ACTIVO" th:selected="${estado=='ACTIVO'}">Activo</option><option value="INACTIVO" th:selected="${estado=='INACTIVO'}">Inactivo</option></select><select name="size"><option value="10" th:selected="${size==10}">10 por página</option><option value="20" th:selected="${size==20}">20 por página</option><option value="50" th:selected="${size==50}">50 por página</option></select><button class="btn primary">Aplicar</button><a class="btn secondary" th:href="@{/agricultores}">Limpiar</a></form><div class="table-responsive"><table><thead><tr><th>Nombre</th><th>DNI</th><th>Sector</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:if="${pagina.empty}"><td colspan="5" class="empty-state">No existen agricultores para los filtros aplicados.</td></tr><tr th:each="a:${pagina.content}"><td th:text="|${a.nombres} ${a.apellidos}|"></td><td th:text="${a.dni}"></td><td th:text="${a.sector}"></td><td><span class="pill" th:text="${a.estado}"></span></td><td class="actions"><a th:href="@{/agricultores/{id}/editar(id=${a.id})}">Editar</a><form th:action="@{/agricultores/{id}/estado(id=${a.id})}" method="post"><button class="link" th:text="${a.estado=='ACTIVO'?'Desactivar':'Reactivar'}"></button></form><form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/agricultores/{id}/eliminar(id=${a.id})}" method="post" onsubmit="return confirm('¿Eliminar agricultor?');"><button class="link danger">Eliminar</button></form></td></tr></tbody></table></div><div th:replace="~{fragments/paginacion :: paginador(${pagina},'/agricultores',${q},${estado},${size})}"></div></main></section></body></html>
