<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('notificaciones')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Notificaciones')}"></div><main class="content"><header class="page-title"><div><h1>Centro de notificaciones</h1><p>Revisa avisos operativos, financieros y administrativos.</p></div><form th:if="${noLeidas > 0}" th:action="@{/notificaciones/leer-todas}" method="post"><button class="btn secondary">Marcar todas como leídas</button></form></header><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><section class="notification-list"><article th:each="n:${pagina.content}" class="notification-card" th:classappend="${n.estado=='NO_LEIDA'}?' unread':''"><div><span class="pill" th:text="${n.prioridad}"></span><small th:text="${#temporals.format(n.fechaCreacion,'dd/MM/yyyy HH:mm')}"></small></div><h2 th:text="${n.titulo}"></h2><p th:text="${n.mensaje}"></p><div class="actions"><a class="btn secondary" th:if="${n.referenciaUrl!=null}" th:href="${n.referenciaUrl}">Revisar</a><form th:if="${n.estado=='NO_LEIDA'}" th:action="@{/notificaciones/{id}/leer(id=${n.id})}" method="post"><button class="link">Marcar leída</button></form><form th:action="@{/notificaciones/{id}/archivar(id=${n.id})}" method="post"><button class="link danger">Archivar</button></form></div></article><p th:if="${#lists.isEmpty(pagina.content)}">No existen notificaciones.</p></section></main></section></body></html>
