<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Detalle de cuenta</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v6.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('tesoreria')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Detalle de cuenta')}"></div><main class="content"><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><section class="summary-grid"><article><span>Código</span><strong th:text="${cuenta.codigo}"></strong></article><article><span>Total</span><strong th:text="|S/ ${cuenta.montoTotal}|"></strong></article><article><span>Pagado</span><strong th:text="|S/ ${cuenta.montoPagado}|"></strong></article><article><span>Saldo</span><strong th:text="|S/ ${cuenta.saldoPendiente}|"></strong></article></section><section class="finance-card" th:if="${cuenta.estado!='PAGADA' and cuenta.estado!='ANULADA'}"><h2>Registrar pago parcial</h2><form class="form" th:object="${pagoForm}" th:action="@{/tesoreria/cuentas/{id}/pagar(id=${cuenta.id})}" method="post"><div class="notice bad" th:if="${#fields.hasGlobalErrors()}"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Monto</label><input type="number" step=".01" th:field="*{monto}"><label>Fecha</label><input type="date" th:field="*{fecha}"><label>Comprobante</label><input th:field="*{comprobante}"><label>Método</label><select th:field="*{metodo}"><option value="EFECTIVO">Efectivo</option><option value="YAPE">Yape</option><option value="PLIN">Plin</option><option value="TRANSFERENCIA">Transferencia</option></select><button class="btn primary">Aplicar pago</button></form></section><a class="btn secondary" th:href="@{/tesoreria/cuentas}">Volver</a></main></section></body></html>
