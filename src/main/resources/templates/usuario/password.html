<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v5.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Usuarios y roles')}"></div><main class="content"><header class="page-title"><div><h1>Cambiar contraseña</h1><p th:text="|Usuario: ${usuario.username} · ${usuario.nombres} ${usuario.apellidos}|"></p></div><a class="btn secondary" th:href="@{/usuarios}">Volver</a></header><section class="user-form-card"><form class="form" th:object="${form}" method="post"><div class="notice bad" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><div class="form-group"><label>Nueva contraseña</label><input type="password" th:field="*{nuevaPassword}" autocomplete="new-password"><small class="field-error" th:errors="*{nuevaPassword}"></small></div><div class="form-group"><label>Confirmar contraseña</label><input type="password" th:field="*{confirmarPassword}" autocomplete="new-password"><small class="field-error" th:errors="*{confirmarPassword}"></small></div><div class="form-actions"><a class="btn secondary" th:href="@{/usuarios}">Cancelar</a><button class="btn primary">Actualizar contraseña</button></div></form></section></main></section></body></html>
