<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('parcelas')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Parcelas')}"></div><main><h1 th:text="${id==null?'Nueva parcela':'Editar parcela'}"></h1><form class="form" th:object="${form}" th:action="@{/parcelas/guardar}" method="post"><input type="hidden" name="id" th:value="${id}"><div th:each="e:${#fields.globalErrors()}" th:text="${e.defaultMessage}"></div><label>Código</label><input th:field="*{codigo}"><label>Nombre</label><input th:field="*{nombre}"><label>Hectáreas</label><input type="number" step=".01" th:field="*{hectareas}"><label>Cultivo</label><input th:field="*{cultivo}"><label>Agricultor activo</label><select th:field="*{agricultorId}"><option value="">Selecciona</option><option th:each="a:${agricultores}" th:value="${a.id}" th:text="|${a.nombres} ${a.apellidos}|"></option></select><label>Estado</label><select th:field="*{estado}"><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option><option value="EN_MANTENIMIENTO">En mantenimiento</option></select><button>Guardar</button></form></main></section></body></html>
