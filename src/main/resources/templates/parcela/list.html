<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v4.css}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('parcelas')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Parcelas')}"></div><main><h1>Parcelas</h1><div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div><a class="btn" th:href="@{/parcelas/nueva}">Nueva parcela</a><table><tr><th>Código</th><th>Nombre</th><th>Agricultor</th><th>Área</th><th>Cultivo</th><th>Estado</th><th>Acciones</th></tr><tr th:each="p:${parcelas}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="|${p.agricultor.nombres} ${p.agricultor.apellidos}|"></td><td th:text="|${p.hectareas} ha|"></td><td th:text="${p.cultivo}"></td><td><span class="pill" th:text="${p.estado}"></span></td><td class="actions"><a th:href="@{/parcelas/{id}/editar(id=${p.id})}">Editar</a><form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/parcelas/{id}/eliminar(id=${p.id})}" method="post" onsubmit="return confirm('¿Eliminar parcela?');"><button class="link danger">Eliminar</button></form></td></tr></table></main></section></body></html>
