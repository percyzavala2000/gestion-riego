<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace=
             "~{fragments/sidebar :: sidebar('tesoreria')}">
</div>
<main><h1>Tesorería</h1>
    <h2>S/ <span th:text="${total}">0</span></h2>
    <form class="form" th:object="${form}" th:action="@{/tesoreria}" method="post">
        <select id="agricultorId"
                th:field="*{agricultorId}">

            <option value="">
                Selecciona un agricultor
            </option>

            <option th:each="agricultor : ${agricultores}"
                    th:value="${agricultor.id}"
                    th:text="|${agricultor.nombres} ${agricultor.apellidos}|">
                Agricultor
            </option>

        </select>
        <input type="number" step=".01" th:field="*{monto}" placeholder="Monto">
        <input type="date" th:field="*{fecha}">
        <input th:field="*{concepto}" placeholder="Concepto">
        <input th:field="*{comprobante}" placeholder="Comprobante">
        <select id="metodo"
                th:field="*{metodo}">
            <option value="">
                Selecciona el método
            </option>
            <option value="EFECTIVO">
                Efectivo
            </option>
            <option value="TRANSFERENCIA">
                Transferencia bancaria
            </option>
            <option value="YAPE">
                Yape
            </option>
            <option value="PLIN">
                Plin
            </option>
        </select>
        <button>Registrar pago</button>
    </form>
    <table>
        <tr>
            <th>Fecha</th>
            <th>Agricultor</th>
            <th>Monto</th>
            <th>Método</th>
        </tr>
        <tr th:each="p:${pagos}">
            <td th:text="${p.fecha}"></td>
            <td th:text="${p.agricultor.nombres+' '+p.agricultor.apellidos}"></td>
            <td th:text="${p.monto}"></td>
            <td th:text="${p.metodo}"></td>
        </tr>
    </table>
</main>
</body>
</html>
