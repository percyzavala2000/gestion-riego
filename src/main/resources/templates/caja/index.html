<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Caja</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/v8.css}"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar('caja')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Caja, egresos y devoluciones')}"></div><main class="content">
<div class="notice ok" th:if="${exito}" th:text="${exito}"></div><div class="notice bad" th:if="${error}" th:text="${error}"></div>
<section class="cash-grid">
<article class="cash-card"><h2>Registrar egreso</h2><form class="form" th:object="${egresoForm}" th:action="@{/tesoreria/caja/egresos}" method="post"><input type="date" th:field="*{fecha}"><input th:field="*{concepto}" placeholder="Concepto"><textarea th:field="*{descripcion}" placeholder="Descripción"></textarea><input type="number" step=".01" th:field="*{monto}" placeholder="Monto"><select th:field="*{metodo}"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option></select><input th:field="*{comprobante}" placeholder="Comprobante"><button class="btn primary">Registrar</button></form></article>
<article class="cash-card"><h2>Solicitar devolución</h2><form class="form" th:object="${devolucionForm}" th:action="@{/tesoreria/caja/devoluciones}" method="post"><select th:field="*{pagoId}"><option value="">Pago confirmado</option><option th:each="p:${pagos}" th:value="${p.id}" th:text="|${p.codigo} - S/ ${p.monto}|"></option></select><input type="number" step=".01" th:field="*{monto}" placeholder="Monto"><textarea th:field="*{motivo}" placeholder="Motivo"></textarea><button class="btn primary">Solicitar</button></form></article>
<article class="cash-card"><h2>Cierre de caja</h2><form class="form" th:object="${cierreForm}" th:action="@{/tesoreria/caja/cierres}" method="post"><input type="date" th:field="*{fecha}"><input type="number" step=".01" th:field="*{saldoInicial}" placeholder="Saldo inicial"><input type="number" step=".01" th:field="*{saldoContado}" placeholder="Saldo contado"><textarea th:field="*{observaciones}" placeholder="Observaciones"></textarea><button class="btn primary">Cerrar caja</button></form></article>
</section>
<h2>Egresos</h2><table><tr><th>Código</th><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Estado</th><th>Acción</th></tr><tr th:each="e:${egresos}"><td th:text="${e.codigo}"></td><td th:text="${e.fecha}"></td><td th:text="${e.concepto}"></td><td th:text="|S/ ${e.monto}|"></td><td th:text="${e.estado}"></td><td><form th:if="${e.estado=='REGISTRADO'}" th:action="@{/tesoreria/caja/egresos/{id}/anular(id=${e.id})}" method="post"><input name="motivo" placeholder="Motivo" required><button class="link danger">Anular</button></form></td></tr></table>
<h2>Devoluciones</h2><table><tr><th>Código</th><th>Pago</th><th>Monto</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr><tr th:each="d:${devoluciones}"><td th:text="${d.codigo}"></td><td th:text="${d.pago.codigo}"></td><td th:text="|S/ ${d.monto}|"></td><td th:text="${d.motivo}"></td><td th:text="${d.estado}"></td><td class="actions"><form th:if="${d.estado=='SOLICITADA'}" th:action="@{/tesoreria/caja/devoluciones/{id}/aprobar(id=${d.id})}" method="post"><button class="link">Aprobar</button></form><form th:if="${d.estado=='SOLICITADA'}" th:action="@{/tesoreria/caja/devoluciones/{id}/rechazar(id=${d.id})}" method="post"><button class="link danger">Rechazar</button></form><form th:if="${d.estado=='APROBADA'}" th:action="@{/tesoreria/caja/devoluciones/{id}/ejecutar(id=${d.id})}" method="post"><button class="link">Ejecutar</button></form></td></tr></table>
<h2>Cierres</h2><table><tr><th>Fecha</th><th>Saldo teórico</th><th>Saldo contado</th><th>Diferencia</th><th>Estado</th><th>Acción administrativa</th></tr><tr th:each="c:${cierres}"><td th:text="${c.fecha}"></td><td th:text="|S/ ${c.saldoTeorico}|"></td><td th:text="|S/ ${c.saldoContado}|"></td><td th:text="|S/ ${c.diferencia}|"></td><td th:text="${c.estado}"></td><td><form sec:authorize="hasRole('ADMINISTRADOR')" th:if="${c.estado=='CERRADO'}" th:action="@{/tesoreria/caja/cierres/{id}/reabrir(id=${c.id})}" method="post"><input name="motivo" maxlength="500" placeholder="Motivo obligatorio" required><button class="link danger">Reabrir</button></form><span th:if="${c.estado=='REABIERTO'}">Admite movimientos y un nuevo cierre</span></td></tr></table>
</main></section></body></html>
