<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header(title)"
        class="topbar">
    <div th:if="${entornoDemo}" class="demo-environment-banner">ENTORNO DE DEMOSTRACIÓN · DATOS FICTICIOS</div>

    <div class="breadcrumb-container">

        <span>Gestión</span>
        <span class="breadcrumb-separator">›</span>

        <strong th:text="${title}">
            Dashboard
        </strong>

    </div>

    <div class="topbar-actions">

        <span class="current-date"
              th:text="${#temporals.format(
                  #temporals.createNow(),
                  'dd/MM/yyyy'
              )}">
            30/10/2026
        </span>

        <a th:href="@{/notificaciones}"
           class="notification-button"
           aria-label="Ir al centro de notificaciones"
           title="Notificaciones">
            <span aria-hidden="true">♧</span>
        </a>
        <div class="current-user">

            <div class="user-avatar"
                 sec:authentication="principal.iniciales">
                AD
            </div>

            <div class="user-information">

                <strong sec:authentication=
                                "principal.nombreCompleto">
                    Administrador Vichayal
                </strong>

                <small sec:authentication=
                               "principal.rolLegible">
                    Administrador
                </small>

            </div>

        </div>

    </div>

</header>

</body>
</html>
