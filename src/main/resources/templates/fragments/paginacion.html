<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body><nav th:fragment="paginador(pagina,baseUrl,q,estado,size)" class="pagination-bar" th:if="${pagina.totalElements>0}"><p class="pagination-summary" th:text="|Mostrando ${pagina.number*pagina.size+1}–${pagina.number*pagina.size+pagina.numberOfElements} de ${pagina.totalElements} registros|"></p><div class="pagination-controls"><a class="btn secondary" th:if="${!pagina.first}" th:href="@{${baseUrl}(q=${q},estado=${estado},page=${pagina.number-1},size=${size})}">Anterior</a><span th:text="|Página ${pagina.number+1} de ${pagina.totalPages}|"></span><a class="btn secondary" th:if="${!pagina.last}" th:href="@{${baseUrl}(q=${q},estado=${estado},page=${pagina.number+1},size=${size})}">Siguiente</a></div></nav></body></html>
