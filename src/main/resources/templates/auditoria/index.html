<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría</title><link rel="stylesheet" th:href="@{/css/app.css(v=1083)}"></head><body><div th:replace="~{fragments/sidebar :: sidebar('auditoria')}"></div><section class="workspace"><div th:replace="~{fragments/header :: header('Auditoría')}"></div><main class="content"><header class="page-title"><div><h1>Auditoría</h1><p>Consulta trazabilidad por usuario, solicitud, resultado y correlación.</p></div></header><div class="notice bad" th:if="${error}" th:text="${error}"></div>
<form class="list-filters audit-filters" method="get" th:action="@{/auditoria}"><input name="q" th:value="${q}" placeholder="Texto general"><input name="usuario" th:value="${usuario}" placeholder="Usuario"><select name="metodo"><option value="">Todos los métodos</option><option value="POST" th:selected="${metodo=='POST'}">POST</option><option value="PUT" th:selected="${metodo=='PUT'}">PUT</option><option value="PATCH" th:selected="${metodo=='PATCH'}">PATCH</option><option value="DELETE" th:selected="${metodo=='DELETE'}">DELETE</option></select><select name="familiaHttp"><option value="">Todos los HTTP</option><option value="2XX" th:selected="${familiaHttp=='2XX'}">2xx Éxito</option><option value="3XX" th:selected="${familiaHttp=='3XX'}">3xx Redirección</option><option value="4XX" th:selected="${familiaHttp=='4XX'}">4xx Cliente</option><option value="5XX" th:selected="${familiaHttp=='5XX'}">5xx Servidor</option></select><input name="ruta" th:value="${ruta}" placeholder="Ruta"><input name="correlacionId" th:value="${correlacionId}" placeholder="Correlation ID"><input type="date" name="fechaDesde" th:value="${fechaDesde}"><input type="date" name="fechaHasta" th:value="${fechaHasta}"><select name="size"><option value="10" th:selected="${size==10}">10</option><option value="25" th:selected="${size==25}">25</option><option value="50" th:selected="${size==50}">50</option></select><button class="btn primary">Aplicar</button><a class="btn secondary" th:href="@{/auditoria}">Limpiar</a></form>
<div class="table-responsive"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Rol</th><th>Solicitud</th><th>HTTP</th><th>IP</th><th>Correlación</th></tr></thead><tbody><tr th:if="${pagina.empty}"><td colspan="7" class="empty-state">No existen eventos para los filtros aplicados.</td></tr><tr th:each="evento:${pagina.content}"><td th:text="${#temporals.format(evento.fechaHora,'dd/MM/yyyy HH:mm:ss')}"></td><td th:text="${evento.usuario}"></td><td th:text="${evento.rol}"></td><td><strong th:text="${evento.metodo}"></strong><br><span th:text="${evento.ruta}"></span></td><td><span class="pill" th:text="${evento.codigoHttp}"></span></td><td th:text="${evento.direccionIp}"></td><td><code th:text="${evento.correlacionId}"></code></td></tr></tbody></table></div>
<nav class="pagination-bar" th:if="${pagina.totalElements>0}"><p class="pagination-summary" th:text="|Mostrando ${pagina.number*pagina.size+1}–${pagina.number*pagina.size+pagina.numberOfElements} de ${pagina.totalElements} eventos|"></p><div class="pagination-controls"><a class="btn secondary" th:if="${!pagina.first}" th:href="@{/auditoria(q=${q},usuario=${usuario},metodo=${metodo},ruta=${ruta},correlacionId=${correlacionId},familiaHttp=${familiaHttp},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},page=${pagina.number-1},size=${size})}">Anterior</a><span th:text="|Página ${pagina.number+1} de ${pagina.totalPages}|"></span><a class="btn secondary" th:if="${!pagina.last}" th:href="@{/auditoria(q=${q},usuario=${usuario},metodo=${metodo},ruta=${ruta},correlacionId=${correlacionId},familiaHttp=${familiaHttp},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},page=${pagina.number+1},size=${size})}">Siguiente</a></div></nav>
</main></section></body></html>
