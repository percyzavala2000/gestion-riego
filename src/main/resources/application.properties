spring.application.name=gestion-riego
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=VICHAYAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

vichayal.audit.retention-days=${AUDIT_RETENTION_DAYS:365}
vichayal.audit.cleanup-cron=${AUDIT_CLEANUP_CRON:0 30 2 * * *}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Seguridad API agricultor v10.1
vichayal.auth.max-intentos=${AUTH_MAX_INTENTOS:5}
vichayal.auth.bloqueo-minutos=${AUTH_BLOQUEO_MINUTOS:15}
vichayal.auth.access-token-minutos=${AUTH_ACCESS_TOKEN_MINUTOS:15}
vichayal.auth.refresh-token-dias=${AUTH_REFRESH_TOKEN_DIAS:14}

# Notificaciones persistentes v10.2
vichayal.notifications.generation-cron=${NOTIFICATIONS_GENERATION_CRON:0 15 6 * * *}
vichayal.notifications.cleanup-cron=${NOTIFICATIONS_CLEANUP_CRON:0 45 2 * * *}
vichayal.notifications.read-retention-days=${NOTIFICATIONS_READ_RETENTION_DAYS:180}
vichayal.notifications.archived-retention-days=${NOTIFICATIONS_ARCHIVED_RETENTION_DAYS:90}
