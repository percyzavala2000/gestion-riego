spring.docker.compose.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=prod
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
logging.structured.format.console=ecs
vichayal.audit.retention-days=${AUDIT_RETENTION_DAYS:365}
vichayal.audit.cleanup-cron=${AUDIT_CLEANUP_CRON:0 30 2 * * *}

# Seguridad API agricultor v10.1
vichayal.auth.max-intentos=${AUTH_MAX_INTENTOS:5}
vichayal.auth.bloqueo-minutos=${AUTH_BLOQUEO_MINUTOS:15}
vichayal.auth.access-token-minutos=${AUTH_ACCESS_TOKEN_MINUTOS:15}
vichayal.auth.refresh-token-dias=${AUTH_REFRESH_TOKEN_DIAS:14}

# Notificaciones persistentes v10.2
vichayal.notifications.generation-cron=${NOTIFICATIONS_GENERATION_CRON:0 15 6 * * *}
vichayal.notifications.cleanup-cron=${NOTIFICATIONS_CLEANUP_CRON:0 45 2 * * *}
vichayal.notifications.read-retention-days=${NOTIFICATIONS_READ_RETENTION_DAYS:180}
vichayal.notifications.archived-retention-days=${NOTIFICATIONS_ARCHIVED_RETENTION_DAYS:90}
