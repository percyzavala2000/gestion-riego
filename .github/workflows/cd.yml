name: Despliegue continuo en Azure

on:
  workflow_run:
    workflows:
      - Integracion continua
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-azure-produccion
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/percyzavala2000/gestion-riego
  AZURE_RESOURCE_GROUP: rg-vichayal-prod
  AZURE_CONTAINER_APP: ca-vichayal-web
  APP_URL: https://ca-vichayal-web.jollypond-6a611a28.northcentralus.azurecontainerapps.io

jobs:
  deploy:
    name: Publicar imagen y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 35

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Resolver commit que se desplegara
        id: commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            COMMIT_SHA="$WORKFLOW_RUN_SHA"
          else
            COMMIT_SHA="$CURRENT_SHA"
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA invalido: $COMMIT_SHA"
            exit 1
          fi

          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Descargar codigo aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Autenticar en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Azure Container Apps
        shell: bash
        run: |
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            --output none

      - name: Comprobar salud del despliegue
        shell: bash
        run: |
          HEALTH_URL="${APP_URL}/actuator/health"

          for intento in {1..30}; do
            CODIGO=$(curl \
              --silent \
              --show-error \
              --location \
              --output health.json \
              --write-out '%{http_code}' \
              --max-time 15 \
              "$HEALTH_URL" || true)

            if [ "$CODIGO" = "200" ] && grep -q '"status":"UP"' health.json; then
              echo "Aplicacion saludable."
              cat health.json
              exit 0
            fi

            echo "Intento $intento: HTTP $CODIGO"
            sleep 10
          done

          echo "La aplicacion no alcanzo el estado UP."
          cat health.json 2>/dev/null || true

          az containerapp logs show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --type console \
            --tail 80 || true

          exit 1

      - name: Resumen
        shell: bash
        run: |
          {
            echo "### Despliegue completado"
            echo
            echo "- Commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Imagen: \`${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP}\`"
            echo "- URL: ${APP_URL}"
            echo "- Estado: \`UP\`"
          } >> "$GITHUB_STEP_SUMMARY"
