name: Integracion continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar con pruebas unitarias e integracion
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          if-no-files-found: warn
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
