services:

  postgres:
    image: postgres:18
    container_name: vichayal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_riego}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion_password}
      PGDATA: /var/lib/postgresql/data/pgdata # <-- Nueva variable requerida
      TZ: America/Lima
      PGTZ: America/Lima

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql # <-- Montaje cambiado a la raíz de postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_user} -d ${POSTGRES_DB:-gestion_riego}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vichayal-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vichayal.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: